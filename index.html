<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitt svenska quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <h1 class="heading">Mitt svenska quiz</h1>

        <button class="button">Nästa fråga</button>
        <div id="result"></div>
    </div>
</body>
</html>
